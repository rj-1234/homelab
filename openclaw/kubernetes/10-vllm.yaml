---
# Self-hosted OpenAI-compatible inference endpoint for OpenClaw + Open WebUI.
# Model/quant/context/tool-parser are env vars, not baked into the command,
# so swapping models is `kubectl set env` + `kubectl rollout restart`, not a
# manifest edit. TOOL_CALL_PARSER must match the model family (hermes for
# Qwen2/2.5/Hermes, llama3_json for Llama 3.x, mistral for Mistral) — see
# https://docs.vllm.ai/en/latest/features/tool_calling.html
#
# Host prep on cheeky before first apply:
#   sudo mkdir -p /srv/openclaw/vllm-cache
#   kubectl -n openclaw create secret generic vllm-api-key \
#     --from-literal=key="$(openssl rand -hex 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: openclaw
  labels: { app.kubernetes.io/name: vllm }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: vllm } }
  template:
    metadata: { labels: { app.kubernetes.io/name: vllm } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky }
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command: ["/bin/sh", "-c"]
          args:
            - >-
              vllm serve "$MODEL_ID"
              --quantization "$QUANTIZATION"
              --max-model-len "$MAX_MODEL_LEN"
              --enable-auto-tool-choice
              --tool-call-parser "$TOOL_CALL_PARSER"
              --gpu-memory-utilization 0.90
              --api-key "$VLLM_API_KEY"
              --port 8000
          env:
            - { name: MODEL_ID, value: "Qwen/Qwen2.5-7B-Instruct-AWQ" }
            - { name: QUANTIZATION, value: "awq" }
            - { name: MAX_MODEL_LEN, value: "8192" }
            - { name: TOOL_CALL_PARSER, value: "hermes" }
            - { name: HF_HOME, value: /root/.cache/huggingface }
            - name: VLLM_API_KEY
              valueFrom: { secretKeyRef: { name: vllm-api-key, key: key } }
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 80   # first run downloads + quantizes weights
          resources:
            requests: { cpu: "2" }
            limits: { nvidia.com/gpu: "1" }
          volumeMounts:
            - { name: hf-cache, mountPath: /root/.cache/huggingface }
      volumes:
        - name: hf-cache
          hostPath: { path: /srv/openclaw/vllm-cache, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: openclaw
  labels: { app.kubernetes.io/name: vllm }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.50
  selector: { app.kubernetes.io/name: vllm }
  ports: [{ name: http, port: 8000, targetPort: http }]
