---
# Homepage config (https://gethomepage.dev). All standard files are provided so
# the container never needs to write into the read-only mount. Edit tiles/links
# here; re-apply + rollout restart to update.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: platform
data:
  settings.yaml: |
    title: cheeky-mini
    theme: dark
    color: slate
    headerStyle: clean
    target: _blank
    iconStyle: gradient
    hideVersion: true
    useEqualHeights: true
    background:
      image: /images/background.jpg
      blur: md
      brightness: 50
      opacity: 60
    # 4 columns, single row per tab; Homepage stacks them to a single column
    # on narrow (mobile) viewports automatically.
    layout:
      Public:
        tab: Public
        icon: mdi-earth
        style: row
        columns: 4
      Private:
        tab: Private
        icon: mdi-lock-outline
        style: row
        columns: 4
      Infra:
        tab: Infra
        icon: mdi-server
        style: row
        columns: 4
      Platform:
        tab: Platform
        icon: mdi-robot-outline
        style: row
        columns: 4

  services.yaml: |
    - Public:
        - Jellyfin:
            href: https://jellyfin.ch33ky.org
            description: Movies & TV
            icon: jellyfin.png
            namespace: media
            app: jellyfin
            widget:
              type: jellyfin
              url: http://jellyfin.media.svc.cluster.local:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
              enableNowPlaying: true
              enableUser: true
              enableMediaControl: true
              showEpisodeNumber: true
              expandOneStreamToTwoRows: true
        - Flowers:
            href: https://flowers.ch33ky.org
            description: Digital flower delivery · tie a bouquet, choose how long it lasts
            icon: sh-appflowy
            namespace: flowers
            app: public-web
        - Cloudflare Tunnel:
            href: https://one.dash.cloudflare.com
            description: Public ingress · ch33ky.org
            icon: cloudflare-zero-trust.png
            widget:
              type: cloudflared
              accountid: "{{HOMEPAGE_VAR_CF_ACCOUNT_ID}}"
              tunnelid: "{{HOMEPAGE_VAR_CF_TUNNEL_ID}}"
              key: "{{HOMEPAGE_VAR_CF_API_TOKEN}}"
    - Private:
        - qBittorrent:
            href: https://cheeky-mini.tail2f4253.ts.net:8080
            description: Torrent client · via ProtonVPN
            icon: qbittorrent.png
            namespace: media
            app: qbittorrent
            widget:
              type: qbittorrent
              url: http://10.43.200.23:8080
              username: cheeky
              password: "{{HOMEPAGE_VAR_QBIT_PW}}"
              enableLeechProgress: true
              enableLeechSize: true
        - Prowlarr:
            href: https://cheeky-mini.tail2f4253.ts.net:9696
            description: Indexer search · tailnet-only
            icon: prowlarr.png
            namespace: media
            app: prowlarr
            widget:
              type: prowlarr
              url: http://prowlarr.media.svc.cluster.local:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        - Radarr:
            href: https://cheeky-mini.tail2f4253.ts.net:7878
            description: Movies · auto-fetch & organize · tailnet-only
            icon: radarr.png
            namespace: media
            app: radarr
            widget:
              type: radarr
              url: http://radarr.media.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
              enableQueue: true
        - Sonarr:
            href: https://cheeky-mini.tail2f4253.ts.net:8989
            description: TV · auto-fetch & organize · tailnet-only
            icon: sonarr.png
            namespace: media
            app: sonarr
            widget:
              type: sonarr
              url: http://sonarr.media.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
              enableQueue: true
        - Field Vault:
            href: https://cheeky-mini.tail2f4253.ts.net:8091
            description: Vault · library · semantic search
            icon: sh-origamivault
            namespace: docs
            app: api
        - Flowers Admin:
            href: https://cheeky-mini.tail2f4253.ts.net:8092
            description: Sent bouquets · tailnet-only
            icon: mdi-flower-outline
            namespace: flowers
            app: admin-web
        - Wetty:
            href: https://cheeky-mini.tail2f4253.ts.net:8098
            description: Web terminal · isolated shell per session
            icon: wetty.png
            namespace: containerssh
            app: wetty
        - n8n:
            href: https://cheeky-mini.tail2f4253.ts.net:8099
            description: Workflow automation · tailnet-only
            icon: n8n.png
            namespace: n8n
            app: n8n
    - Infra:
        - Headlamp:
            href: https://cheeky-mini.tail2f4253.ts.net
            description: Kubernetes dashboard · tailnet-only
            icon: headlamp.png
            namespace: platform
            app: headlamp
        - Grafana:
            href: https://cheeky-mini.tail2f4253.ts.net:8443
            description: Metrics & dashboards · tailnet-only
            icon: grafana.png
            namespace: monitoring
            app: grafana
            widget:
              type: grafana
              version: 2
              alerts: grafana
              url: http://monitoring-grafana.monitoring.svc.cluster.local:80
              username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PW}}"
        - Traefik:
            href: https://cheeky-mini.tail2f4253.ts.net:8444/dashboard/
            description: Ingress controller · tailnet-only
            icon: traefik.png
            namespace: kube-system
            app: traefik
            widget:
              type: traefik
              url: http://10.43.200.40:8080
        - pgweb:
            href: https://cheeky-mini.tail2f4253.ts.net:8081
            description: Docs + Flowers DB · tables, rows, read-only SQL
            icon: sh-postgresql
            namespace: platform
            app: pgweb
        - Zot Registry:
            href: https://cheeky-mini.tail2f4253.ts.net:8095
            description: Self-hosted OCI registry · tailnet-only
            icon: sh-zot-registry-light
            namespace: platform
            app: zot
    - Platform:
        - Open WebUI:
            href: https://cheeky-mini.tail2f4253.ts.net:8094
            description: Chat UI onto vLLM (Llama-3.2-3B) · tailnet-only
            icon: open-webui.png
            namespace: local-llm
            app: open-webui
        - Hermes Agent:
            href: https://cheeky-mini.tail2f4253.ts.net:8096
            description: Agent dashboard · WhatsApp via vLLM · tailnet-only
            icon: sh-hermes-agent
            namespace: hermes
            app: hermes
        - Hindsight UI:
            href: https://cheeky-mini.tail2f4253.ts.net:8097
            description: Hermes memory bank · knowledge graph · tailnet-only
            icon: sh-basic-memory-light
            namespace: hermes
            app: hermes

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  bookmarks.yaml: |
    []

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: |
    # (unused — no Docker; k3s only)
