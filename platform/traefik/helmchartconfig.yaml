# Merges into k3s's auto-applied `traefik` HelmChart (kube-system). Turns on
# the dashboard/API inside the pod without adding it to Traefik's public
# 80/443 LoadBalancer — reached privately instead via dashboard-svc.yaml +
# tailscale serve (see bin/homelab cmd_serve). Chart: traefik-40.1.3+up40.1.0.
#
# service.spec.type: ClusterIP — deliberate (this repackaged chart reads
# service.spec.type, not the top-level service.type). LoadBalancer (the
# chart default) makes
# klipper/ServiceLB claim host ports 80/443 via a non-interface-scoped iptables
# DNAT rule, which hijacked ALL port-443 traffic node-wide, including
# tailscale serve's Headlamp binding on :443 (confirmed live: curl to the
# tailnet :443 URL came back presenting Traefik's own default cert instead of
# reaching Headlamp). Nothing routes through Traefik's public entrypoints yet
# (no IngressRoutes exist for any app) — flip to LoadBalancer only once
# something is deliberately being exposed through it.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        type: ClusterIP
    api:
      dashboard: true
    ports:
      traefik:
        expose:
          default: false
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
          - traefik
        matchRule: PathPrefix(`/dashboard`) || PathPrefix(`/api`)
