---
# Zot config (https://zotregistry.dev) — minimal OCI registry, no auth (see
# deployment.yaml comment for why plain-HTTP + no-auth is fine here).
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: platform
data:
  config.json: |
    {
      "storage": { "rootDirectory": "/var/lib/registry" },
      "http": { "address": "0.0.0.0", "port": "5000" },
      "extensions": {
        "search": { "enable": true },
        "ui": { "enable": true }
      },
      "log": { "level": "info" }
    }
