---
# Static single-user auth: checks the connecting SSH public key against one
# fixed authorized key (containerssh-authorized-key Secret). No user
# database, no external OAuth dependency — see containerssh/auth-webhook/
# for the source (~40 lines, same "small custom service" pattern as
# doc-catalog/flower-delivery). Built + pushed to the self-hosted Zot
# registry, same as Hermes Agent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: containerssh-auth-webhook
  namespace: containerssh
  labels: { app.kubernetes.io/name: containerssh-auth-webhook }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: containerssh-auth-webhook } }
  template:
    metadata: { labels: { app.kubernetes.io/name: containerssh-auth-webhook } }
    spec:
      # Pinned to cheeky-mini: containerd's Zot mirror config
      # (/etc/rancher/k3s/registries.yaml) isn't live on cheeky yet — same
      # node Hermes Agent already pulls its Zot-built image on successfully.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: ["cheeky-mini"] }
      containers:
        - name: auth-webhook
          image: 10.43.200.51:5000/containerssh-auth-webhook:latest
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - secretRef: { name: containerssh-authorized-key }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: containerssh-auth-webhook
  namespace: containerssh
  labels: { app.kubernetes.io/name: containerssh-auth-webhook }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: containerssh-auth-webhook }
  ports: [{ name: http, port: 8080, targetPort: http }]
