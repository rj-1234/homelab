---
# Tailnet-only admin surface. Caddy serves the static Vite build and
# reverse-proxies only /api/admin/* to the api pod — the recipient-facing
# /api/gifts/:id path is never reachable from here, matching the create-
# private/open-public split. ClusterIP is pinned so the existing
# `tailscale serve --https=8092` binding (from before this app was rebuilt)
# keeps working without re-running that command.
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-web-caddy
  namespace: flowers
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }
    :8080 {
      encode gzip
      handle /api/admin/* {
        reverse_proxy api:8000
      }
      handle {
        root * /srv/web
        try_files {path} /index.html
        file_server
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web
  namespace: flowers
  labels: { app.kubernetes.io/name: admin-web }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: admin-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: admin-web } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky-mini }
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: caddy
          image: caddy:2-alpine
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: XDG_DATA_HOME, value: /tmp/caddy-data }
            - { name: XDG_CONFIG_HOME, value: /tmp/caddy-config }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy }
            - { name: web, mountPath: /srv/web, readOnly: true }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: caddyfile
          configMap: { name: admin-web-caddy }
        - name: web
          hostPath:
            path: /home/cheeky/github/homelab/flower-delivery/admin/dist
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: admin-web
  namespace: flowers
  labels: { app.kubernetes.io/name: admin-web }
spec:
  type: ClusterIP
  clusterIP: 10.43.13.38
  selector: { app.kubernetes.io/name: admin-web }
  ports: [{ name: http, port: 8080, targetPort: http }]
