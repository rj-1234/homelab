---
# Plain postgres:16 (no pgvector needed — no embeddings in this app). Single
# node: hostPath on a dedicated dataset, pinned to cheeky-mini, isolated from
# doc-catalog's Postgres (separate namespace, separate Secret, separate data
# dir).
#
# Secret is created out-of-band, NEVER committed:
#   kubectl -n flowers create secret generic flowers-postgres \
#     --from-literal=POSTGRES_USER=flowers \
#     --from-literal=POSTGRES_PASSWORD=<pw> \
#     --from-literal=POSTGRES_DB=flowers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: flowers
  labels: { app.kubernetes.io/name: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky-mini }
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef: { name: flowers-postgres }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: pg, containerPort: 5432 }]
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "flowers"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: pgdata
          hostPath: { path: /srv/flowers/pg, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flowers
  labels: { app.kubernetes.io/name: postgres }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
