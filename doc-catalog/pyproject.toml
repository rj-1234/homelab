[project]
name = "doccat"
version = "0.1.0"
description = "Personal document cataloging service (ingest, dedupe, search)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "puremagic>=1.28",        # pure-python byte-sniffing (no libmagic system lib)
    "pymupdf>=1.24",          # PDF text-layer extraction + page raster (Tier-0; AGPL)
    "anthropic>=0.40",        # Claude vision OCR escalation (Phase 4)
    "pillow>=10.4",           # image decode/normalize
    "pillow-heif>=0.18",      # HEIC support
    "numpy>=1.26",            # PaddleOCR input arrays
    # paddleocr is heavy (paddlepaddle) — installed only in the worker pod's
    # initContainer, not here, so local dev stays light.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",  # FastAPI multipart form parsing for uploads
]

[project.scripts]
doccat-migrate = "doccat.migrate:main"
doccat-worker = "doccat.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doccat"]
