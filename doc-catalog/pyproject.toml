[project]
name = "doccat"
version = "0.1.0"
description = "Personal document cataloging service (ingest, dedupe, search)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "puremagic>=1.28",        # pure-python byte-sniffing (no libmagic system lib)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
doccat-migrate = "doccat.migrate:main"
doccat-worker = "doccat.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doccat"]
