---
# Local Postgres browser (pgweb). ClusterIP only — deliberately NOT exposed via
# tailscale serve, so it stays on-box. Reach it from cheeky-mini with:
#   kubectl -n docs port-forward svc/pgweb 8081:8081
#   → http://localhost:8081   (localhost only; nothing on the tailnet)
# Read-only (--readonly) so it's a viewer, not an editor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  namespace: docs
  labels: { app.kubernetes.io/name: pgweb }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: pgweb } }
  template:
    metadata: { labels: { app.kubernetes.io/name: pgweb } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky-mini }
      containers:
        - name: pgweb
          image: sosedoff/pgweb:latest
          args: ["pgweb", "--bind=0.0.0.0", "--listen=8081", "--readonly"]
          envFrom:
            - secretRef: { name: doccat-postgres }
          env:
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"
          ports: [{ name: http, containerPort: 8081 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pgweb
  namespace: docs
  labels: { app.kubernetes.io/name: pgweb }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: pgweb }
  ports: [{ name: http, port: 8081, targetPort: http }]
