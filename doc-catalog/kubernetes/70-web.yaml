---
# Decoupled UI: Caddy serves the SvelteKit static build and reverse-proxies the
# JSON API + SSE stream to the api pod, so the browser talks to a single origin.
# The build is produced on the host (`cd web && npm run build`) and hostPath-
# mounted read-only — same no-Node-in-prod pattern as the rest. Runs in parallel
# with the Python UI (api's HTML routes) until it reaches parity.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-caddy
  namespace: docs
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }
    :8080 {
      encode gzip
      # SSE stream: disable proxy buffering so events flush immediately.
      handle /api/events {
        reverse_proxy api:8000 {
          flush_interval -1
        }
      }
      handle /api/* {
        reverse_proxy api:8000
      }
      # SPA: serve static assets, fall back to index.html for client routing.
      handle {
        root * /srv/web
        try_files {path} /index.html
        file_server
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: docs
  labels: { app.kubernetes.io/name: web }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: web } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky-mini }
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: caddy
          image: caddy:2-alpine
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # writable dirs for the rootless caddy user
            - { name: XDG_DATA_HOME, value: /tmp/caddy-data }
            - { name: XDG_CONFIG_HOME, value: /tmp/caddy-config }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy }
            - { name: web, mountPath: /srv/web, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: caddyfile
          configMap: { name: web-caddy }
        - name: web
          hostPath:
            path: /home/cheeky/github/homelab/doc-catalog/web/build
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: docs
  labels: { app.kubernetes.io/name: web }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.33
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: http, port: 8080, targetPort: http }]
