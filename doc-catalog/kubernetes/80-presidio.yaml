---
# PII analyzer service: Microsoft Presidio + spaCy on CPU. Own pod (memory
# isolation) and — importantly — PII recognition stays on-node, nothing egresses.
# No custom build: python:3.12-slim + pip into an emptyDir + hostPath source. The
# spaCy model is installed as a pip wheel into /deps (importable by name). Custom
# recognizers (recognizers.py) are registered at startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio
  namespace: docs
  labels: { app.kubernetes.io/name: presidio }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: presidio } }
  template:
    metadata: { labels: { app.kubernetes.io/name: presidio } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky-mini }
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      initContainers:
        - name: deps
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            # presidio-analyzer pulls spaCy; pin the en_core_web_sm wheel to a
            # matching version and install it into /deps so it imports by name.
            - pip install --target=/deps --no-cache-dir
              'presidio-analyzer>=2.2' 'spacy>=3.7,<3.8'
              https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl
              'fastapi>=0.115' 'uvicorn[standard]>=0.32'
          volumeMounts: [{ name: deps, mountPath: /deps }]
      containers:
        - name: presidio
          image: python:3.12-slim
          command: ["python", "-m", "uvicorn", "doccat.presidio:app",
                    "--host", "0.0.0.0", "--port", "8000"]
          env:
            - { name: PYTHONPATH, value: /deps:/app/src }
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: PRESIDIO_SPACY_MODEL, value: en_core_web_sm }
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - { name: deps, mountPath: /deps }
            - { name: app, mountPath: /app, readOnly: true }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }   # spaCy sm + analyzer
      volumes:
        - { name: deps, emptyDir: {} }
        - name: app
          hostPath: { path: /home/cheeky/github/homelab/doc-catalog, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: presidio
  namespace: docs
  labels: { app.kubernetes.io/name: presidio }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.34
  selector: { app.kubernetes.io/name: presidio }
  ports: [{ name: http, port: 8000, targetPort: http }]
