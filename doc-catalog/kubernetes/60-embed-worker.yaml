---
# Dedicated embed worker: drains only the 'embed' stage so a slow/large document
# never blocks text/OCR (the main worker in 20-worker.yaml runs text,ocr). Both
# consume the same job queue in parallel via FOR UPDATE SKIP LOCKED. This pod is
# light — it reads page text from Postgres, calls the embedder service over HTTP,
# and writes vectors/tags back. No Paddle, no /srv/docs mount, no ingest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed-worker
  namespace: docs
  labels: { app.kubernetes.io/name: embed-worker }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: embed-worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: embed-worker } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky-mini }
      securityContext: { runAsUser: 1000, runAsGroup: 1000 }
      initContainers:
        - name: deps
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - pip install --target=/deps --no-cache-dir
              'psycopg[binary]>=3.2' numpy puremagic 'pymupdf>=1.24'
          volumeMounts: [{ name: deps, mountPath: /deps }]
      containers:
        - name: embed-worker
          image: python:3.12-slim
          command: ["python", "-m", "doccat.worker"]
          envFrom:
            - secretRef: { name: doccat-postgres }
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - { name: EMBEDDER_URL, value: "http://embedder:8000" }
            - { name: WORKER_STAGES, value: "embed,embed_pages" }
            - { name: WORKER_INGEST, value: "false" }
            - { name: PYTHONPATH, value: "/deps:/app/src" }
            - { name: PYTHONUNBUFFERED, value: "1" }
          volumeMounts:
            - { name: deps, mountPath: /deps }
            - { name: app, mountPath: /app, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - { name: deps, emptyDir: {} }
        - name: app
          hostPath: { path: /home/cheeky/github/homelab/doc-catalog, type: Directory }
