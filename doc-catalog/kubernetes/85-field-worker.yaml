---
# Field-vault worker. Drains the `fields` stage only: pulls a document's text,
# calls the Presidio service, and writes candidate vault fields (unconfirmed).
# Thin — it talks to Presidio over HTTP, so it needs no NLP libs itself. Stage-
# worker pattern (like ocr-worker / embed-worker); no ingest, no Gmail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: field-worker
  namespace: docs
  labels: { app.kubernetes.io/name: field-worker }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: field-worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: field-worker } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky-mini }
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      initContainers:
        - name: deps
          image: python:3.12-slim
          command: ["sh", "-c"]
          # psycopg + pymupdf (jobs imports extract at module load). Presidio is a
          # remote call, so none of its libs are needed here.
          args:
            - pip install --target=/deps --no-cache-dir
              'psycopg[binary]>=3.2' 'pymupdf>=1.24'
          volumeMounts: [{ name: deps, mountPath: /deps }]
      containers:
        - name: field-worker
          image: python:3.12-slim
          command: ["python", "-m", "doccat.worker"]
          envFrom:
            - secretRef: { name: doccat-postgres }
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - { name: DOCS_ROOT, value: /srv/docs }
            - { name: PRESIDIO_URL, value: "http://presidio:8000" }
            - { name: WORKER_STAGES, value: "fields" }
            - { name: WORKER_INGEST, value: "false" }
            - { name: HOME, value: /tmp }
            - { name: PYTHONPATH, value: "/deps:/app/src" }
            - { name: PYTHONUNBUFFERED, value: "1" }
          volumeMounts:
            - { name: deps, mountPath: /deps }
            - { name: app, mountPath: /app, readOnly: true }
            - { name: docs, mountPath: /srv/docs }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - { name: deps, emptyDir: {} }
        - name: app
          hostPath: { path: /home/cheeky/github/homelab/doc-catalog, type: Directory }
        - name: docs
          hostPath: { path: /srv/docs, type: Directory }
