---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: qbittorrent-config, namespace: media }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels: { app.kubernetes.io/name: qbittorrent }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: qbittorrent } }
  template:
    metadata: { labels: { app.kubernetes.io/name: qbittorrent } }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: homelab/media-store, operator: In, values: ["seagate"] }
      containers:
        # --- gluetun: VPN gateway. Both containers share the pod network ns,
        #     so qBittorrent's traffic is forced through the tunnel; if the VPN
        #     drops, gluetun's kill-switch blocks all egress. ---
        - name: gluetun
          image: qmcgaw/gluetun:latest
          securityContext:
            capabilities: { add: [NET_ADMIN] }
          envFrom:
            - secretRef: { name: gluetun-vpn }   # VPN_SERVICE_PROVIDER, VPN_TYPE, WIREGUARD_PRIVATE_KEY
          env:
            - { name: TZ, value: "America/New_York" }
            # Allow the cluster to reach the qBittorrent UI + let pods/k8s API talk back.
            - { name: FIREWALL_INPUT_PORTS, value: "8080" }
            - { name: FIREWALL_OUTBOUND_SUBNETS, value: "10.42.0.0/16,10.43.0.0/16" }
            - { name: VPN_PORT_FORWARDING, value: "on" }   # ProtonVPN supports NAT-PMP
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: tun, mountPath: /dev/net/tun }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { memory: 256Mi }
        # --- qBittorrent: no network config of its own; rides gluetun's ns ---
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "America/New_York" }
            - { name: WEBUI_PORT, value: "8080" }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data,   mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { memory: 1Gi }
      volumes:
        - { name: config, persistentVolumeClaim: { claimName: qbittorrent-config } }
        - name: data
          hostPath: { path: /srv/data, type: Directory }
        - name: tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
  labels: { app.kubernetes.io/name: qbittorrent }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.23
  selector: { app.kubernetes.io/name: qbittorrent }
  ports: [{ name: http, port: 8080, targetPort: http }]
