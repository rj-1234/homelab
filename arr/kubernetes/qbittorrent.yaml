---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: qbittorrent-config, namespace: media }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels: { app.kubernetes.io/name: qbittorrent }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: qbittorrent } }
  template:
    metadata: { labels: { app.kubernetes.io/name: qbittorrent } }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: homelab/media-store, operator: In, values: ["seagate"] }
      # NOTE: VPN (gluetun) removed for now — torrent traffic uses the node's
      # real IP. Re-add the gluetun sidecar (see git history / arr README) once
      # a paid P2P VPN key is available, or switch to Usenet.
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "America/New_York" }
            - { name: WEBUI_PORT, value: "8080" }
            - { name: TORRENTING_PORT, value: "6881" }
          ports:
            - { name: http,    containerPort: 8080 }
            - { name: bt-tcp,  containerPort: 6881, protocol: TCP }
            - { name: bt-udp,  containerPort: 6881, protocol: UDP }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data,   mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { memory: 1Gi }
      volumes:
        - { name: config, persistentVolumeClaim: { claimName: qbittorrent-config } }
        - name: data
          hostPath: { path: /srv/data, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
  labels: { app.kubernetes.io/name: qbittorrent }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.23
  selector: { app.kubernetes.io/name: qbittorrent }
  ports: [{ name: http, port: 8080, targetPort: http }]
