---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: prowlarr-config, namespace: media }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
  labels: { app.kubernetes.io/name: prowlarr }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: prowlarr } }
  template:
    metadata: { labels: { app.kubernetes.io/name: prowlarr } }
    spec:
      # All *arr + qbit pinned to the node holding the rpool/data dataset.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: homelab/media-store, operator: In, values: ["seagate"] }
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "America/New_York" }
          ports: [{ name: http, containerPort: 9696 }]
          volumeMounts:
            - { name: config, mountPath: /config }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits:   { memory: 512Mi }
      volumes:
        - { name: config, persistentVolumeClaim: { claimName: prowlarr-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
  labels: { app.kubernetes.io/name: prowlarr }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.20        # pinned for tailscale serve
  selector: { app.kubernetes.io/name: prowlarr }
  ports: [{ name: http, port: 9696, targetPort: http }]
