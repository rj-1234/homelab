---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: sonarr-config, namespace: media }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
  labels: { app.kubernetes.io/name: sonarr }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: sonarr } }
  template:
    metadata: { labels: { app.kubernetes.io/name: sonarr } }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: homelab/media-store, operator: In, values: ["seagate"] }
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "America/New_York" }
          ports: [{ name: http, containerPort: 8989 }]
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits:   { memory: 512Mi }
      volumes:
        - { name: config, persistentVolumeClaim: { claimName: sonarr-config } }
        - name: data
          hostPath: { path: /srv/data, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
  labels: { app.kubernetes.io/name: sonarr }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.22
  selector: { app.kubernetes.io/name: sonarr }
  ports: [{ name: http, port: 8989, targetPort: http }]
