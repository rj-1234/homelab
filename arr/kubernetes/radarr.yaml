---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: radarr-config, namespace: media }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
  labels: { app.kubernetes.io/name: radarr }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: radarr } }
  template:
    metadata: { labels: { app.kubernetes.io/name: radarr } }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: homelab/media-store, operator: In, values: ["seagate"] }
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "America/New_York" }
          ports: [{ name: http, containerPort: 7878 }]
          volumeMounts:
            - { name: config, mountPath: /config }
            # Single /data root so downloads + library share a filesystem
            # (hardlinks + atomic moves; no copy). TRaSH-guides layout.
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits:   { memory: 512Mi }
      volumes:
        - { name: config, persistentVolumeClaim: { claimName: radarr-config } }
        - name: data
          hostPath: { path: /srv/data, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media
  labels: { app.kubernetes.io/name: radarr }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.21
  selector: { app.kubernetes.io/name: radarr }
  ports: [{ name: http, port: 7878, targetPort: http }]
