---
# Hermes Agent (https://github.com/NousResearch/hermes-agent) — agent
# orchestrator on top of local-llm's vLLM endpoint, WhatsApp as the primary
# channel. No GPU needed, kept off the GPU node deliberately.
#
# Image is built+pushed by hand from a pinned release tag, not vendored
# into this repo — see README for the exact build/push commands.
#
# Two containers sharing this pod's network namespace replaces upstream's
# docker-compose `network: host` + `depends_on` pattern: `dashboard`
# reaches `gateway` over loopback, which a shared pod netns gives for free
# without `hostNetwork: true`. `gateway` makes only outbound connections
# (WhatsApp/Telegram/etc. are all agent-initiated) and needs no Service.
#
# `dashboard` holds API keys — upstream binds it to 127.0.0.1 and
# recommends SSH-tunnel-only access. We deviate deliberately: bound to
# 0.0.0.0 here and exposed over the tailnet (`homelab serve`), same trust
# level already given to every other admin UI in this repo (Headlamp,
# Grafana, Traefik, Zot) — a Service can't reach a loopback-only bind
# anyway, so 127.0.0.1 would mean kubectl-port-forward-only, which is a
# real usability cost for a bar this repo doesn't hold anywhere else.
#
# Host prep on cheeky-mini before first apply:
#   sudo mkdir -p /srv/hermes/data
#   sudo chown 10000:10000 /srv/hermes/data
#   kubectl -n hermes create secret generic vllm-api-key \
#     --from-literal=key="$(kubectl -n local-llm get secret vllm-api-key -o jsonpath='{.data.key}' | base64 -d)"
#   kubectl -n hermes create secret generic hermes-dashboard-auth \
#     --from-literal=password_hash='<output of hash_password(), see README>'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels: { app.kubernetes.io/name: hermes }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: hermes } }
  template:
    metadata: { labels: { app.kubernetes.io/name: hermes } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky-mini }
      enableServiceLinks: false
      # 10000:10000 — the image's `hermes` user (upstream docker-compose
      # default HERMES_UID/HERMES_GID). Confirm against the actual built
      # image (`docker run --rm <image> id hermes`) before first apply.
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      # Hermes's "custom" provider reads model.api_key as a literal string
      # from config.yaml — confirmed by reading its own credential_sources.py/
      # credential_pool.py: custom-provider credentials are seeded ONLY from
      # config.yaml (model.api_key or custom_providers.<name>.api_key), never
      # from an env var (that env-var path, `_seed_from_env`, only covers
      # pre-registered named providers like openrouter — "custom" isn't in
      # that registry). `${VLLM_API_KEY}`-style interpolation inside the
      # YAML value does NOT happen — it gets sent to vLLM as that literal
      # string, which is why this returned HTTP 401 the first time. Since we
      # don't want the raw key committed to git in the ConfigMap, this
      # initContainer does the substitution ourselves: renders the real
      # config.yaml from the ConfigMap template into the shared /opt/data
      # volume before the main containers start, using plain `sed` (no
      # eval, no extra image dependency).
      initContainers:
        - name: render-config
          image: 10.43.200.51:5000/hermes-agent:v2026.8.3
          command: ["sh", "-c"]
          args:
            # rm first: an empty root:root 0644 config.yaml already sits in
            # /opt/data (created before this initContainer existed, likely
            # by kubelet materializing the old subPath mount target as root
            # before securityContext dropped privileges) — UID 10000 can't
            # write into a root-owned file directly, but it does own the
            # parent dir, so it can unlink it and create a fresh one.
            - >-
              rm -f /opt/data/config.yaml &&
              sed
              -e "s|\${VLLM_API_KEY}|$VLLM_API_KEY|g"
              -e "s|\${DASHBOARD_PW_HASH}|$DASHBOARD_PW_HASH|g"
              /config-template/config.yaml > /opt/data/config.yaml
          env:
            - name: VLLM_API_KEY
              valueFrom: { secretKeyRef: { name: vllm-api-key, key: key } }
            - name: DASHBOARD_PW_HASH
              valueFrom: { secretKeyRef: { name: hermes-dashboard-auth, key: password_hash } }
          volumeMounts:
            - { name: config, mountPath: /config-template, readOnly: true }
            - { name: data, mountPath: /opt/data }
      containers:
        - name: gateway
          image: 10.43.200.51:5000/hermes-agent:v2026.8.3
          # args, not command — command overrides the image's ENTRYPOINT
          # (entrypoint-dispatch.sh, which parses "gateway run" itself and
          # keeps s6-overlay supervision intact); args only overrides CMD,
          # matching what upstream's docker-compose `command:` key does.
          args: ["gateway", "run"]
          env:
            - { name: HERMES_UID, value: "10000" }
            - { name: HERMES_GID, value: "10000" }
            - { name: WHATSAPP_ENABLED, value: "true" }
            - { name: WHATSAPP_ALLOWED_USERS, value: "+13472164621" }
            - name: VLLM_API_KEY
              valueFrom: { secretKeyRef: { name: vllm-api-key, key: key } }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
        - name: dashboard
          image: 10.43.200.51:5000/hermes-agent:v2026.8.3
          args: ["dashboard", "--host", "0.0.0.0", "--no-open"]
          env:
            - { name: HERMES_UID, value: "10000" }
            - { name: HERMES_GID, value: "10000" }
            - name: DASHBOARD_PW_HASH
              valueFrom: { secretKeyRef: { name: hermes-dashboard-auth, key: password_hash } }
          ports: [{ name: dashboard, containerPort: 9119 }]
          volumeMounts:
            - { name: data, mountPath: /opt/data }
      volumes:
        - name: data
          hostPath: { path: /srv/hermes/data, type: Directory }
        - name: config
          configMap: { name: hermes-config }
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-dashboard
  namespace: hermes
  labels: { app.kubernetes.io/name: hermes }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.53
  selector: { app.kubernetes.io/name: hermes }
  ports: [{ name: dashboard, port: 9119, targetPort: dashboard }]
