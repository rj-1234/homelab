---
# Hermes Agent config (https://github.com/NousResearch/hermes-agent) —
# model/provider config lives at $HERMES_HOME/config.yaml (HERMES_HOME=
# /opt/data in the image). Mounted as a single file into the hostPath data
# dir (10-hermes.yaml), doesn't clobber the rest of /opt/data (session DB,
# lazy-installed packages, WhatsApp pairing state all live there too).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  config.yaml: |
    model:
      provider: custom
      base_url: "http://vllm.local-llm.svc.cluster.local:8000/v1"
      api_key: "${VLLM_API_KEY}"   # from the gateway container's env, see 10-hermes.yaml
      default: "llama-3.2-3b-instruct-awq"
      # local-llm's vLLM serves Llama-3.2-3B-Instruct-AWQ at 65536 —
      # genuinely native long context (no RoPE scaling hack) + fp8
      # KV-cache to fit the 10GB card, clears Hermes's 64K floor with
      # margin. See local-llm/kubernetes/10-vllm.yaml for the full model
      # history (Qwen2.5-7B → YaRN attempt → Gemma 4 E4B → Llama-3.1-8B →
      # this). Keep in sync with vLLM's MAX_MODEL_LEN.
      context_length: 65536
    context_compression:
      enabled: true
      threshold: 0.85
    dashboard:
      # Hermes refuses to bind the dashboard to anything but 127.0.0.1
      # without an auth provider configured — required to expose it over
      # the tailnet (see 10-hermes.yaml). Hash generated once via the
      # image's own `hash_password()` helper, stored in the
      # hermes-dashboard-auth Secret, not committed here.
      basic_auth:
        username: "admin"
        password_hash: "${DASHBOARD_PW_HASH}"
