---
# Self-hosted OpenAI-compatible inference endpoint — backs Open WebUI and,
# going forward, Hermes Agent.
# Model/quant/context/tool-parser are env vars, not baked into the command,
# so swapping models is `kubectl set env` + `kubectl rollout restart`, not a
# manifest edit. TOOL_CALL_PARSER must match the model family (hermes for
# Qwen2/2.5/Hermes, llama3_json for Llama 3.x, mistral for Mistral, gemma4
# for Gemma 4) — see https://docs.vllm.ai/en/latest/features/tool_calling.html
#
# Host prep on cheeky before first apply:
#   sudo mkdir -p /srv/openclaw/vllm-cache   # path kept as-is post-rename, real cached weights live here
#   kubectl -n local-llm create secret generic vllm-api-key \
#     --from-literal=key="$(openssl rand -hex 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: local-llm
  labels: { app.kubernetes.io/name: vllm }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: vllm } }
  template:
    metadata: { labels: { app.kubernetes.io/name: vllm } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky }
      # k8s auto-injects Docker-links env vars for every Service in this
      # namespace (VLLM_PORT, VLLM_SERVICE_HOST, ...) — collides with vLLM's
      # own VLLM_PORT env var and crashes EngineCore on startup. Disable.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command: ["/bin/sh", "-c"]
          args:
            - >-
              vllm serve "$MODEL_ID"
              --quantization "$QUANTIZATION"
              --max-model-len "$MAX_MODEL_LEN"
              --enable-auto-tool-choice
              --tool-call-parser "$TOOL_CALL_PARSER"
              --gpu-memory-utilization "$GPU_MEM_UTIL"
              --enforce-eager
              --kv-cache-dtype "$KV_CACHE_DTYPE"
              --served-model-name "$SERVED_MODEL_NAME"
              --api-key "$VLLM_API_KEY"
              --port 8000
          env:
            # Was Qwen2.5-7B-Instruct-AWQ (native 32768, below Hermes
            # Agent's hard 64K context floor). Tried RoPE-extrapolating it
            # via YaRN — broke output quality. Tried Gemma 4 E4B for real
            # native long-context + multimodal — failed to boot at all
            # (`AmbiguousGlobalPerLayerAttributeError`, its per-layer
            # config format isn't supported by this vLLM version yet).
            # Tried Llama-3.1-8B-Instruct-AWQ — booted, but the math doesn't
            # close on this GPU: weights alone took 5.39GiB, and full
            # (non-sliding-window) attention needs ~128KB/token of KV
            # cache, so 65536 tokens needs ~8GiB more — vLLM's own error
            # confirmed max feasible length at these settings was ~16.5K.
            # No amount of gpu-memory-utilization/fp8-KV-cache tuning closes
            # an ~8GiB gap on a 9.64GiB-usable card. Settled on
            # Llama-3.2-3B-Instruct instead — same native 128K context and
            # llama3_json tool-calling, ~3.5GiB lighter on weights, which is
            # what actually needed to change (not the tuning knobs).
            - { name: MODEL_ID, value: "casperhansen/llama-3.2-3b-instruct-awq" }
            # Slash-free alias for the API-facing `model` field — OpenClaw's
            # config parses model refs as "provider/model", and the raw
            # MODEL_ID (itself containing a "/") collides with that.
            - { name: SERVED_MODEL_NAME, value: "llama-3.2-3b-instruct-awq" }
            - { name: QUANTIZATION, value: "awq" }
            # RTX 3080 only exposes ~9.64GiB usable (desktop GPU, not
            # headless) — 0.90 + CUDA graph capture OOM'd at startup on an
            # earlier model. Starting conservative again for the same
            # reason; raise once a clean boot confirms real headroom.
            - { name: GPU_MEM_UTIL, value: "0.80" }
            # Native context is 128K — targeting 65536 (comfortably above
            # Hermes's 64K floor) rather than the full window, to leave
            # KV-cache margin on a 10GB card.
            - { name: MAX_MODEL_LEN, value: "65536" }
            # At 0.80 util this model alone left only 5.26GiB for KV cache
            # (65536 tokens needs 7.0GiB) — vLLM's own error put the max
            # feasible length at ~49K without this. fp8 halves bytes/token,
            # closing the gap with real margin (unlike pushing
            # gpu-memory-utilization to ~0.95, which would close it with
            # ~zero slack on a card that's already desktop-not-headless
            # constrained). Unlike the earlier YaRN attempt, fp8 here is
            # isolated — no RoPE hack stacked on top, this model's 128K is
            # genuinely native — so this is the clean single-variable test
            # the YaRN incident's own follow-up notes called for. Confirm
            # with a real multi-turn chat before trusting it, not just a
            # healthy startup log (that's exactly what YaRN's failure
            # looked like too).
            - { name: KV_CACHE_DTYPE, value: "fp8" }
            - { name: TOOL_CALL_PARSER, value: "llama3_json" }
            - { name: HF_HOME, value: /root/.cache/huggingface }
            - name: VLLM_API_KEY
              valueFrom: { secretKeyRef: { name: vllm-api-key, key: key } }
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 80   # first run downloads + quantizes weights
          resources:
            requests: { cpu: "2" }
            limits: { nvidia.com/gpu: "1" }
          volumeMounts:
            - { name: hf-cache, mountPath: /root/.cache/huggingface }
      volumes:
        - name: hf-cache
          hostPath: { path: /srv/openclaw/vllm-cache, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: local-llm
  labels: { app.kubernetes.io/name: vllm }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.50
  selector: { app.kubernetes.io/name: vllm }
  ports: [{ name: http, port: 8000, targetPort: http }]
