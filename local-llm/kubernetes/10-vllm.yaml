---
# Self-hosted OpenAI-compatible inference endpoint — backs Open WebUI and,
# going forward, Hermes Agent.
# Model/quant/context/tool-parser are env vars, not baked into the command,
# so swapping models is `kubectl set env` + `kubectl rollout restart`, not a
# manifest edit. TOOL_CALL_PARSER must match the model family (hermes for
# Qwen2/2.5/Hermes, llama3_json for Llama 3.x, mistral for Mistral, gemma4
# for Gemma 4) — see https://docs.vllm.ai/en/latest/features/tool_calling.html
#
# Host prep on cheeky before first apply:
#   sudo mkdir -p /srv/openclaw/vllm-cache   # path kept as-is post-rename, real cached weights live here
#   kubectl -n local-llm create secret generic vllm-api-key \
#     --from-literal=key="$(openssl rand -hex 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: local-llm
  labels: { app.kubernetes.io/name: vllm }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: vllm } }
  template:
    metadata: { labels: { app.kubernetes.io/name: vllm } }
    spec:
      nodeSelector: { kubernetes.io/hostname: cheeky }
      # k8s auto-injects Docker-links env vars for every Service in this
      # namespace (VLLM_PORT, VLLM_SERVICE_HOST, ...) — collides with vLLM's
      # own VLLM_PORT env var and crashes EngineCore on startup. Disable.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command: ["/bin/sh", "-c"]
          args:
            - >-
              vllm serve "$MODEL_ID"
              --quantization "$QUANTIZATION"
              --max-model-len "$MAX_MODEL_LEN"
              --enable-auto-tool-choice
              --tool-call-parser "$TOOL_CALL_PARSER"
              --gpu-memory-utilization "$GPU_MEM_UTIL"
              --enforce-eager
              --kv-cache-dtype "$KV_CACHE_DTYPE"
              --chat-template "$CHAT_TEMPLATE"
              --served-model-name "$SERVED_MODEL_NAME"
              --api-key "$VLLM_API_KEY"
              --port 8000
          env:
            # Model-selection history (Qwen2.5 -> YaRN -> Gemma4 -> 3.1-8B,
            # all rejected before landing here): see memory
            # vllm-model-selection-history.
            - { name: MODEL_ID, value: "casperhansen/llama-3.2-3b-instruct-awq" }
            # Slash-free alias for the API-facing `model` field — OpenClaw's
            # config parses model refs as "provider/model", and the raw
            # MODEL_ID (itself containing a "/") collides with that.
            - { name: SERVED_MODEL_NAME, value: "llama-3.2-3b-instruct-awq" }
            - { name: QUANTIZATION, value: "awq" }
            # RTX 3080 only exposes ~9.64GiB usable (desktop GPU, not
            # headless) — 0.90 + CUDA graph capture OOM'd at startup on an
            # earlier model. Starting conservative again for the same
            # reason; raise once a clean boot confirms real headroom.
            - { name: GPU_MEM_UTIL, value: "0.80" }
            # Native context is 128K — targeting 65536 (Hermes's floor) to
            # leave KV-cache margin on a 10GB card.
            - { name: MAX_MODEL_LEN, value: "65536" }
            # fp8 KV-cache needed to fit 65536 tokens in the VRAM left after
            # weights at 0.80 util; genuinely native 128K context, no RoPE
            # hack stacked on top. See memory vllm-model-selection-history.
            - { name: KV_CACHE_DTYPE, value: "fp8" }
            - { name: TOOL_CALL_PARSER, value: "llama3_json" }
            # Must match TOOL_CALL_PARSER; without it this model spuriously
            # calls tools on plain messages. See memory
            # vllm-model-selection-history for the repro + fallback
            # (pythonic template/parser) if it resurfaces.
            - { name: CHAT_TEMPLATE, value: "/vllm-workspace/examples/tool_chat_template_llama3.2_json.jinja" }
            - { name: HF_HOME, value: /root/.cache/huggingface }
            - name: VLLM_API_KEY
              valueFrom: { secretKeyRef: { name: vllm-api-key, key: key } }
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 80   # first run downloads + quantizes weights
          resources:
            requests: { cpu: "2" }
            limits: { nvidia.com/gpu: "1" }
          volumeMounts:
            - { name: hf-cache, mountPath: /root/.cache/huggingface }
      volumes:
        - name: hf-cache
          hostPath: { path: /srv/openclaw/vllm-cache, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: local-llm
  labels: { app.kubernetes.io/name: vllm }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.50
  selector: { app.kubernetes.io/name: vllm }
  ports: [{ name: http, port: 8000, targetPort: http }]
