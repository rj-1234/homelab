---
# Chat frontend straight onto the vLLM endpoint — for model testing/debugging
# independent of the OpenClaw agent loop. No GPU needed, just proxies HTTP.
#
# Host prep on cheeky-mini before first apply:
#   sudo mkdir -p /srv/openclaw/open-webui-data   # path kept as-is post-rename, holds real data
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: local-llm
  labels: { app.kubernetes.io/name: open-webui }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: open-webui } }
  template:
    metadata: { labels: { app.kubernetes.io/name: open-webui } }
    spec:
      enableServiceLinks: false   # avoid the VLLM_PORT-style k8s env collision, see 10-vllm.yaml
      nodeSelector: { kubernetes.io/hostname: cheeky-mini }
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          env:
            - { name: OPENAI_API_BASE_URL, value: "http://vllm.local-llm.svc.cluster.local:8000/v1" }
            - { name: WEBUI_AUTH, value: "true" }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: vllm-api-key, key: key } }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            # 1Gi OOM-killed it — the bundled sentence-transformers embedding
            # model (torch) alone exceeds that on load.
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /app/backend/data }
      volumes:
        - name: data
          hostPath: { path: /srv/openclaw/open-webui-data, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: local-llm
  labels: { app.kubernetes.io/name: open-webui }
spec:
  type: ClusterIP
  clusterIP: 10.43.200.52
  selector: { app.kubernetes.io/name: open-webui }
  ports: [{ name: http, port: 8080, targetPort: http }]
